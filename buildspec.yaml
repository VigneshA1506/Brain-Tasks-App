version: 0.2
 
phases:
 
  install:
    commands:
      - echo Installing kubectl...
      - curl -LO https://dl.k8s.io/release/v1.34.9/bin/linux/amd64/kubectl
      - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - kubectl version --client
 
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 675628601405.dkr.ecr.ap-south-1.amazonaws.com
      - REPOSITORY_URI=675628601405.dkr.ecr.ap-south-1.amazonaws.com/brain-tasks-app
      - IMAGE_TAG=$CODEBUILD_BUILD_NUMBER
      - echo Image tag is $IMAGE_TAG
 
  build:
    commands:
      - echo Build started on `date`
      - echo Building Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
 
  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
 
      - echo Connecting to EKS...
      - aws eks update-kubeconfig --region ap-south-1 --name brain-tasks-cluster
 
      - echo Deploying image to EKS...
      - kubectl set image deployment/brain-tasks-app brain-tasks-app=$REPOSITORY_URI:$IMAGE_TAG
 
      - echo Waiting for deployment rollout...
      - kubectl rollout status deployment/brain-tasks-app --timeout=300s
 
      - echo Deployment completed successfully!
      - kubectl get pods
      - kubectl get deployment brain-tasks-app
      - echo Build completed on `date`